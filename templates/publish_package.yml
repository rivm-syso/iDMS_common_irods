spec:
  inputs:
    job_name:
      default: publish_package
    pyproject_location:
      default: .
    stage:
      default: publish
    image:
      default: python:3.11
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  before_script:
    - pip install twine
  script:
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token
      python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi $[[ inputs.pyproject_location ]]/dist/* --verbose
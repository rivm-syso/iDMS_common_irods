
spec:
  inputs:
    job_name:
      default: build_package
    pyproject_location:
      default: .
    stage:
      default: test
    image:
      default: python:3.11
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  before_script:
    - pip install build
  script:
    - python3 -m build $[[ inputs.pyproject_location ]]
  artifacts:
    paths:
      - $[[ inputs.pyproject_location ]]/dist